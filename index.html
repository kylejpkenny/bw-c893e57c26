function textWidth(str, px) { return str.length * 6 * px - px; }

function drawText(str, x, y, px, color, shadow) {
  str = String(str).toUpperCase();
  if (shadow) {
    for (let i = 0; i < str.length; i++) drawGlyph(str[i], x + i * 6 * px + px, y + px, px, shadow);
  }
  for (let i = 0; i < str.length; i++) drawGlyph(str[i], x + i * 6 * px, y, px, color);
}

function drawGlyph(ch, x, y, px, color) {
  const g = FONT[ch] || FONT["?"];
  ctx.fillStyle = color;
  const rows = g.split("/");
  for (let r = 0; r < rows.length; r++) {
    const row = rows[r];
    let run = 0;
    for (let c = 0; c <= row.length; c++) {
      if (row[c] === "#") { run++; }
      else if (run) {
        ctx.fillRect(x + (c - run) * px, y + r * px, run * px, px);
        run = 0;
      }
    }
  }
}

function drawTextCentered(str, cx, y, px, color, shadow) {
  drawText(str, Math.round(cx - textWidth(String(str), px) / 2), y, px, color, shadow);
}

/* =========================================================================
   SPRITE FACTORY — string maps baked once into offscreen canvases
   ======================================================================= */
function makeSprite(map, pal) {
  const rows = map;
  let w = 0;
  for (const r of rows) w = Math.max(w, r.length);
  const h = rows.length;
  const cv = document.createElement("canvas");
  cv.width = w; cv.height = h;
  const c2 = cv.getContext("2d");
  for (let y = 0; y < h; y++) {
    const row = rows[y];
    for (let x = 0; x < row.length; x++) {
      const col = pal[row[x]];
      if (!col) continue;
      c2.fillStyle = col;
      c2.fillRect(x, y, 1, 1);
    }
  }
  return cv;
}

/* Hand-counting a 24-wide char map was a losing game, so the dino is plotted
   with real geometry into a grid and then baked like any other sprite.       */
const DINO_W_SRC = 24, DINO_H_SRC = 22;

function dinoMap(squashed) {
  const w = DINO_W_SRC, h = DINO_H_SRC;
  const grid = Array.from({ length: h }, () => new Array(w).fill("."));
  const set = (x, y, c) => {
    x = Math.round(x); y = Math.round(y);
    if (x >= 0 && x < w && y >= 0 && y < h) grid[y][x] = c;
  };
  const ell = (cx, cy, rx, ry, c) => {
    for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++)
      for (let x = Math.floor(cx - rx); x <= Math.ceil(cx + rx); x++) {
        const dx = (x - cx) / rx, dy = (y - cy) / ry;
        if (dx * dx + dy * dy <= 1.02) set(x, y, c);
      }
  };
  const rect = (x0, y0, ww, hh, c) => {
    for (let y = y0; y < y0 + hh; y++) for (let x = x0; x < x0 + ww; x++) set(x, y, c);
  };

  if (squashed) {
    ell(11.5, 18, 11, 3.2, "G");
    ell(10, 18, 6, 1.8, "Y");
    rect(4, 21, 3, 1, "g"); rect(9, 21, 3, 1, "g"); rect(14, 21, 3, 1, "g");
  } else {
    /* tail — a taper sweeping up and back from the rear of the body */
    for (let i = 0; i < 7; i++) {
      const ty = 12 - i * 0.9, th = Math.max(1, 6 - i * 0.75);
      rect(17 + i, Math.round(ty), 1, Math.round(th), "G");
    }
    /* legs + feet */
    rect(6, 14, 4, 8, "G");
    rect(13, 14, 4, 8, "G");
    rect(4, 20, 6, 2, "G");
    rect(11, 20, 6, 2, "G");
    /* body */
    ell(11, 12, 9, 6, "G");
    /* neck, at the front — he faces left, into the runner */
    rect(5, 1, 6, 10, "G");
    ell(7.5, 1.5, 3, 2, "G");
    /* belly */
    ell(9, 14, 5.5, 3.4, "Y");
  }

  /* automatic edge shading: anything green with nothing below/right of it */
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      if (grid[y][x] !== "G") continue;
      const below = y + 1 < h ? grid[y + 1][x] : ".";
      const right = x + 1 < w ? grid[y][x + 1] : ".";
      if (below === "." || right === ".") grid[y][x] = "g";
    }
  }
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      if (grid[y][x] !== "g") continue;
      const below = y + 1 < h ? grid[y + 1][x] : ".";
      if (below === ".") grid[y][x] = "d";
    }
  }
  /* belly rim — read from a snapshot so the rim doesn't eat the whole belly */
  const snap = grid.map(r => r.slice());
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      if (snap[y][x] !== "Y") continue;
      const edge = [[1,0],[-1,0],[0,1],[0,-1]].some(([dx, dy]) => {
        const nx = x + dx, ny = y + dy;
        return nx < 0 || nx >= w || ny < 0 || ny >= h || snap[ny][nx] !== "Y";
      });
      if (edge) grid[y][x] = "y";
    }
  }
  return grid.map(r => r.join(""));
}

const KYLE_FACE_SRC  = "__KYLE_FACE__";
const INTRO_PHOTO_SRC = "__INTRO_PHOTO__";   // the family photo the game opens on

function loadFace(src) {
  const img = new Image();
  if (src && src.indexOf("data:") === 0) img.src = src;
  return img;
}
const bowenFace = loadFace(BOWEN_FACE_SRC);
const kyleFace  = loadFace(KYLE_FACE_SRC);
const introPhoto = loadFace(INTRO_PHOTO_SRC);
const faceReady = img => img.complete && img.naturalWidth > 0;

/* how wide each photo head is drawn, in virtual px — the "oversized" dial */
const BOWEN_HEAD_W = 19;
const KYLE_HEAD_W  = 17;

let bobble = 0;                   // shared bobblehead phase

/* Draws a photo head with its chin at (cx, chinY), rocking side to side.
   Pivot is the neck, so it rolls like a bobblehead rather than sliding.     */
function drawFace(img, cx, chinY, w, phase, amount) {
  if (!faceReady(img)) return false;
  const h = Math.round(w * img.naturalHeight / img.naturalWidth);
  const a = amount == null ? 1 : amount;
  ctx.save();
  ctx.translate(cx + Math.sin(phase) * 1.3 * a, chinY);
  ctx.rotate(Math.sin(phase) * 0.16 * a);
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(img, -w / 2, -h, w, h);
  ctx.imageSmoothingEnabled = false;
  ctx.restore();
  return true;
}

const BOWEN_W = SPR.bowenRun[0].width;
const BOWEN_BODY_H = SPR.bowenRun[0].height;   // shoulders-to-feet, 11px
const BOWEN_H = 23;                            // full collision height (unchanged)
const BOWEN_BODY_OFF = BOWEN_H - BOWEN_BODY_H; // where the body sits under player.y
const DINO_W = SPR.dino.width;
const DINO_H = SPR.dino.height;
const DINO_NECK_X = 8;            // centre of the neck stub in the body sprite

/* Uncle Kyle rides the neck. One place to change if the sprite is swapped. */
function drawKyleOn(bodyX, bodyY, phase) {
  const cx = bodyX + DINO_NECK_X;
  if (drawFace(kyleFace, cx, bodyY + 4, KYLE_HEAD_W, phase == null ? bobble : phase, 0.7)) return;
  ctx.drawImage(SPR.kyle,
    Math.round(cx - SPR.kyle.width / 2),
    Math.round(bodyY - SPR.kyle.height + 4));
}

/* =========================================================================
   AUDIO — everything synthesised, nothing loaded
   ======================================================================= */
let AC = null;
function audioInit() {
  if (AC) { if (AC.state === "suspended") AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); }
  catch (e) { AC = null; }
}

function blip(freq, dur, type, vol, slideTo, delay) {
  if (!AC) return;
  const t0 = AC.currentTime + (delay || 0);
  const osc = AC.createOscillator();
  const gain = AC.createGain();
  osc.type = type || "square";
  osc.frequency.setValueAtTime(freq, t0);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(vol == null ? 0.15 : vol, t0 + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(gain); gain.connect(AC.destination);
  osc.start(t0); osc.stop(t0 + dur + 0.02);
}

function noiseBurst(dur, vol) {
  if (!AC) return;
  const n = Math.floor(AC.sampleRate * dur);
  const buf = AC.createBuffer(1, n, AC.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const src = AC.createBufferSource();
  const g = AC.createGain();
  g.gain.value = vol == null ? 0.1 : vol;
  src.buffer = buf; src.connect(g); g.connect(AC.destination);
  src.start();
}

const SFX = {
  jump()  { blip(340, 0.16, "square", 0.13, 620); },
  jump2() { blip(480, 0.14, "square", 0.11, 780); },
  coin()  { blip(988, 0.07, "square", 0.12); blip(1319, 0.16, "square", 0.12, null, 0.07); },
  stomp() { blip(220, 0.1, "square", 0.14, 90); noiseBurst(0.08, 0.06); },
  hit()   { blip(300, 0.12, "sawtooth", 0.12, 110); blip(150, 0.28, "square", 0.1, 70, 0.1); },
  flag()  { const s = [523, 659, 784, 1047]; s.forEach((f, i) => blip(f, 0.14, "square", 0.12, null, i * 0.09)); },
  win()   {
    const mel = [523, 659, 784, 1047, 784, 1047, 1319];
    const dur = [0.14, 0.14, 0.14, 0.2, 0.12, 0.12, 0.55];
    let t = 0;
    mel.forEach((f, i) => { blip(f, dur[i], "square", 0.13, null, t); blip(f / 2, dur[i], "triangle", 0.09, null, t); t += dur[i] + 0.02; });
  },
  start() { [392, 523, 659].forEach((f, i) => blip(f, 0.12, "square", 0.12, null, i * 0.08)); },
  /* the photo swinging open */
  open()  {
    blip(196, 0.5, "triangle", 0.08, 392);
    [523, 659, 784, 1047, 1319].forEach((f, i) => blip(f, 0.18, "square", 0.1, null, 0.1 + i * 0.07));
  }
};

/* =========================================================================
   LEVEL — hand-scripted chunks expanded into object lists
   ======================================================================= */
const level = {
  grounds: [],   // {x0,x1} solid floor spans, top = GROUND_Y
  pipes: [],     // {x,y,w,h}
  plats: [],     // {x,y,w}  one-way brick platforms
  dinos: [],
  coins: [],
  bushes: [],
  clouds: [],
  hills: [],
  len: 0,
  flagX: 0,
  castleX: 0
};

function buildLevel() {
  let x = 0;
  let groundFrom = 0;

  const flat = n => { x += n; };
  const pit = w => {
    level.grounds.push({ x0: groundFrom, x1: x });
    x += w;
    groundFrom = x;
  };
  const dino = (offset, patrol) => {
    level.dinos.push({
      x: x + offset, y: GROUND_Y - SPR.dino.height,
      home: x + offset, patrol: patrol || 0, dir: -1, dead: 0, t: 0
    });
  };
  const pipe = h => {
    level.pipes.push({ x: x, y: GROUND_Y - h * TS, w: 26, h: h * TS });
    x += 26;
  };
  const plat = (y, tiles) => {
    level.plats.push({ x: x, y: GROUND_Y - y, w: tiles * TS });
  };
  const coinRow = (n, y, step) => {
    for (let i = 0; i < n; i++) level.coins.push({ x: x + i * (step || 22), y: GROUND_Y - y, got: 0 });
  };
  const coinArc = n => {
    for (let i = 0; i < n; i++) {
      const t = i / (n - 1);
      level.coins.push({ x: x + i * 24, y: GROUND_Y - 34 - Math.round(Math.sin(t * Math.PI) * 40), got: 0 });
    }
  };
  const bush = () => { level.bushes.push({ x: x, size: 1 + (level.bushes.length % 3) }); };

  /* ---- the run ---------------------------------------------------------- */
  flat(300);                       // gentle empty opening — get used to tapping
  coinRow(4, 18);
  flat(140); bush();
  flat(60);  dino(0);              // first dino, plenty of runway
  flat(200);
  coinArc(6);
  flat(180);
  pipe(2);
  flat(90);  dino(0);
  flat(170); bush();
  coinRow(3, 18);
  flat(120);
  pit(44);                         // first little gap
  flat(150);
  dino(0, 34);                     // first walker
  flat(190);
  coinArc(7);
  flat(60);
  pipe(3);
  flat(120); dino(0);
  flat(90);  bush();
  flat(120);
  plat(58, 4);
  coinRow(4, 78, 20);
  flat(150);
  pit(46);
  flat(120);
  dino(0); flat(120); dino(0);     // a pair, spaced out
  flat(200);
  coinArc(6);
  flat(120); bush();
  pipe(2);
  flat(100);
  dino(0, 42);
  flat(200);
  plat(52, 3);
  coinRow(3, 72, 20);
  flat(140);
  pit(48);
  flat(160);
  coinRow(5, 18);
  flat(80);
  dino(0);
  flat(170); bush();
  pipe(3);
  flat(110);
  dino(0, 38);
  flat(190);
  coinArc(8);
  flat(150);
  pit(44);
  flat(140);
  dino(0);
  flat(120);
  plat(60, 5);
  coinRow(5, 80, 20);
  flat(190);
  pipe(2);
  flat(120);
  dino(0); flat(140); dino(0, 30);
  flat(230);
  coinArc(7);
  flat(160); bush();
  flat(220);                       // long calm run-in to the castle
  coinRow(6, 18);
  flat(200);

  level.flagX = x + 40;
  level.castleX = x + 150;
  x += 300;
  level.grounds.push({ x0: groundFrom, x1: x });
  level.len = x;

  /* scenery */
  for (let i = 0; i < 70; i++) {
    level.clouds.push({
      x: 120 + i * 260 + (i % 3) * 70,
      y: 16 + (i % 4) * 22,
      s: 1 + (i % 3) * 0.35
    });
  }
  for (let i = 0; i < 60; i++) {
    level.hills.push({ x: i * 300 + (i % 2) * 130, w: 110 + (i % 3) * 45, h: 22 + (i % 3) * 10 });
  }
}
buildLevel();

/* =========================================================================
   GAME STATE
   ======================================================================= */
let mode = "intro";               // intro | start | play | win
let introT = 0;                   // frames since the intro began
let balloons = [];
const player = {
  x: 60, y: GROUND_Y - BOWEN_H, vy: 0,
  onGround: true, coyote: 0, buffered: 0, jumps: 0,
  anim: 0, invuln: 0, blink: 0
};
let cam = 0;
let coins = 0;
let frame = 0;
let safe = { x: 60, y: GROUND_Y };        // y is the ground line under his feet
let safeTimer = 0;
let winTimer = 0;
let flagDrop = 0;
let flagHit = false;
let confetti = [];
let sparkles = [];
let hintFade = 60;                // "TAP TO JUMP" holds until he jumps, then fades
let hasJumped = false;

function resetRun() {
  player.x = 60; player.y = GROUND_Y - BOWEN_H; player.vy = 0;
  player.onGround = true; player.coyote = 0; player.buffered = 0;
  player.jumps = 0; player.anim = 0; player.invuln = 0;
  cam = 0; coins = 0; frame = 0; winTimer = 0; flagDrop = 0; flagHit = false;
  confetti = []; sparkles = []; hintFade = 60; hasJumped = false;
  safe = { x: 60, y: GROUND_Y }; safeTimer = 0;
  for (const c of level.coins) c.got = 0;
  for (const d of level.dinos) { d.dead = 0; d.x = d.home; d.dir = -1; d.t = 0; }
}

/* =========================================================================
   INPUT — one tap, anywhere
   ======================================================================= */
function tap() {
  audioInit();
  /* a tap during the intro skips ahead rather than starting the run, so an
     impatient tapper can't accidentally miss the title screen entirely */
  if (mode === "intro") { mode = "start"; return; }
  if (mode === "start") { mode = "play"; resetRun(); SFX.start(); return; }
  if (mode === "win") { if (winTimer > 90) { mode = "start"; } return; }
  player.buffered = BUFFER;
}

window.addEventListener("pointerdown", e => { e.preventDefault(); tap(); }, { passive: false });
window.addEventListener("touchstart", e => { e.preventDefault(); }, { passive: false });
window.addEventListener("keydown", e => {
  if (e.code === "Space" || e.code === "ArrowUp" || e.code === "Enter") { e.preventDefault(); tap(); }
});
window.addEventListener("contextmenu", e => e.preventDefault());

/* =========================================================================
   HELPERS
   ======================================================================= */
function groundAt(x) {
  for (const g of level.grounds) if (x >= g.x0 && x < g.x1) return GROUND_Y;
  return null;
}

function overlaps(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

/* the player's forgiving hitbox */
function hitbox() {
  return { x: player.x + 3, y: player.y + 4, w: BOWEN_W - 6, h: BOWEN_H - 4 };
}

function respawn() {
  player.x = safe.x;
  player.y = safe.y - BOWEN_H - 2;
  player.vy = 0;
  player.onGround = false;
  player.jumps = 0;
  player.invuln = 90;
  SFX.hit();
}

function hazardAhead(x) {
  for (const g of level.grounds) if (Math.abs(g.x1 - x) < 90 && g.x1 > x) return true;
  for (const d of level.dinos) if (!d.dead && d.x > x && d.x - x < 90) return true;
  for (const p of level.pipes) if (p.x > x && p.x - x < 90) return true;
  return false;
}

/* =========================================================================
   UPDATE
   ======================================================================= */
/* ---------------------------------------------------------------- intro ---
   Beat 1  (0.0-1.1s)  the photo sits there, whole
   Beat 2  (1.1-1.9s)  it splits down the middle and the halves swing open
   Beat 3  (1.9-4.2s)  HAPPY BIRTHDAY BOWEN behind it, balloons everywhere
   then it hands over to the title screen. A tap skips straight through.     */
const INTRO_HOLD  = 66;
const INTRO_OPEN  = 48;
const INTRO_TITLE = 150;
const INTRO_END   = INTRO_HOLD + INTRO_OPEN + INTRO_TITLE;

function spawnBalloons() {
  const cols = ["#ff4b4b", "#ffd93b", "#4ad2ff", "#5ec14a", "#ff8ad2", "#ff9f2e", "#b98cff"];
  balloons = [];
  for (let i = 0; i < 30; i++) {
    balloons.push({
      x: 12 + (i * 71) % Math.max(40, VW - 24),
      y: VH + 14 + i * 11,                 // staggered so they keep coming
      r: 6 + (i % 3) * 2,
      vy: -0.95 - (i % 5) * 0.2,
      sway: 0.5 + (i % 4) * 0.25,
      phase: i * 1.7,
      c: cols[i % cols.length]
    });
  }
}

function drawBalloon(b, t) {
  const x = b.x + Math.sin(t * 0.03 + b.phase) * 7 * b.sway;
  const y = b.y;
  if (y < -30 || y > VH + 40) return;
  ctx.fillStyle = "rgba(0,0,0,0.12)";
  ctx.beginPath(); ctx.moveTo(x, y + b.r);
  ctx.lineTo(x - 1, y + b.r + 9); ctx.lineTo(x + 1, y + b.r + 9);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = b.c;
  ctx.beginPath(); ctx.ellipse(x, y, b.r, b.r * 1.2, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.45)";
  ctx.beginPath(); ctx.ellipse(x - b.r * 0.32, y - b.r * 0.4, b.r * 0.24, b.r * 0.34, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = b.c;
  ctx.fillRect(Math.round(x) - 1, Math.round(y + b.r * 1.2), 2, 2);
}

function drawIntro() {
  const t = introT;
  drawSky();
  for (let i = 0; i < 7; i++) drawCloud(20 + i * 62, 12 + (i % 3) * 26, 1 + (i % 2) * 0.4);
  ctx.fillStyle = GROUND_TOP; ctx.fillRect(0, GROUND_Y, VW, 5);
  ctx.fillStyle = GROUND_A; ctx.fillRect(0, GROUND_Y + 5, VW, VH - GROUND_Y);

  const cx = VW / 2;
  const open = t <= INTRO_HOLD ? 0 : Math.min(1, (t - INTRO_HOLD) / INTRO_OPEN);
  const ease = 1 - Math.pow(1 - open, 3);

  /* the message underneath, revealed as the photo swings apart */
  if (open > 0.12) {
    const a = Math.min(1, (open - 0.12) / 0.5);
    ctx.globalAlpha = a;
    const pop = 1 + (1 - a) * 0.3;
    ctx.save();
    ctx.translate(cx, 62);
    ctx.scale(pop, pop);
    drawTextCentered("HAPPY BIRTHDAY", 0, -30, 2.8, "#ffffff", "#1d3a7a");
    drawTextCentered("BOWEN", 0, -6, 5.4, "#ffd93b", "#a8531a");
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  /* balloons drift up through the whole thing */
  for (const b of balloons) drawBalloon(b, t);

  /* the photo: whole, then two halves swinging open like doors */
  const ph = Math.min(VH - 30, 132);
  let pw = ph;
  if (faceReady(introPhoto)) pw = ph * introPhoto.naturalWidth / introPhoto.naturalHeight;
  const px = cx - pw / 2, py = (VH - ph) / 2 - 6;

  /* Each half is a door hinged on its OUTER edge. Swinging it open just means
     narrowing its destination rect towards that hinge — a cheap, correct
     foreshortening, no clipping or matrix work needed.                       */
  const sq = Math.cos(ease * Math.PI * 0.5);            // 1 -> 0
  const leafW = (pw / 2) * sq;

  const half = (side) => {
    const dx = side < 0 ? px : px + pw - leafW;
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(dx - 1, py - 2, leafW + 2, ph + 4);    // white photo border
    if (faceReady(introPhoto)) {
      const iw = introPhoto.naturalWidth, ih = introPhoto.naturalHeight;
      ctx.imageSmoothingEnabled = true;
      ctx.drawImage(introPhoto, side < 0 ? 0 : iw / 2, 0, iw / 2, ih, dx, py, leafW, ph);
      ctx.imageSmoothingEnabled = false;
    } else {
      /* no photo embedded yet — a stand-in so the beat still reads */
      ctx.fillStyle = "#2e5fa3";
      ctx.fillRect(dx, py, leafW, ph);
    }
    /* a darker leading edge sells the swing */
    if (ease > 0.02) {
      ctx.fillStyle = "rgba(0,0,0,0.22)";
      ctx.fillRect(side < 0 ? dx + leafW - 2 : dx, py, 2, ph);
    }
  };

  if (leafW > 0.6) {
    half(-1); half(1);
    if (!faceReady(introPhoto) && ease < 0.25) {
      drawTextCentered("PHOTO", cx, py + ph / 2 - 12, 2, "#ffffff");
      drawTextCentered("GOES HERE", cx, py + ph / 2 + 4, 2, "#ffffff");
    }
  }

  if (t > INTRO_END - 30) {
    ctx.globalAlpha = Math.max(0, 1 - (t - (INTRO_END - 30)) / 30);
    ctx.globalAlpha = 1;
  }
}

function update() {
  frame++;
  bobble += (mode === "play" && !player.onGround) ? 0.08 : 0.19;

  if (mode === "intro") {
    introT++;
    for (const b of balloons) b.y += b.vy;
    if (introT === INTRO_HOLD) SFX.open();
    if (introT === INTRO_HOLD + 8) spawnBalloons();
    if (introT >= INTRO_END) mode = "start";
    return;
  }

  if (mode === "start") {
    player.anim += 0.16;
    return;
  }

  if (mode === "win") {
    winTimer++;
    for (const p of confetti) {
      p.x += p.vx; p.y += p.vy; p.vy += 0.045; p.vx *= 0.995; p.r += p.spin;
      if (p.y > VH + 12) { p.y = -10; p.x = Math.random() * VW; p.vy = 0.4 + Math.random(); }
    }
    if (winTimer % 7 === 0 && confetti.length < 190) spawnConfetti(3);
    return;
  }

  /* ------------------------------------------------------------- movement */
  player.x += RUN_SPEED;
  player.anim += 0.19;
  if (player.invuln > 0) player.invuln--;
  if (hasJumped && hintFade > 0) hintFade--;

  /* jump input */
  if (player.buffered > 0) player.buffered--;
  const canFirst = player.onGround || player.coyote > 0;
  if (player.buffered > 0 && (canFirst || player.jumps < 2)) {
    if (canFirst) { player.vy = -JUMP_V; player.jumps = 1; SFX.jump(); }
    else { player.vy = -JUMP2_V; player.jumps = 2; SFX.jump2(); }
    hasJumped = true;
    player.onGround = false;
    player.coyote = 0;
    player.buffered = 0;
  }

  /* gravity */
  player.vy += GRAVITY;
  if (player.vy > 9) player.vy = 9;
  const prevBottom = player.y + BOWEN_H;
  player.y += player.vy;

  if (player.onGround) player.coyote = COYOTE;
  else if (player.coyote > 0) player.coyote--;
  player.onGround = false;

  /* ------------------------------------------------------------ landings */
  const hb = hitbox();
  const feetX = player.x + BOWEN_W / 2;

  /* one-way brick platforms */
  for (const p of level.plats) {
    if (player.vy >= 0 && prevBottom <= p.y + 2 &&
        player.y + BOWEN_H >= p.y &&
        feetX > p.x - 4 && feetX < p.x + p.w + 4) {
      player.y = p.y - BOWEN_H;
      player.vy = 0; player.onGround = true; player.jumps = 0;
    }
  }

  /* pipes: land on top, bump into the side and you just start again */
  for (const p of level.pipes) {
    if (overlaps(hb.x, hb.y, hb.w, hb.h, p.x, p.y, p.w, p.h)) {
      if (player.vy >= 0 && prevBottom <= p.y + 5) {
        player.y = p.y - BOWEN_H;
        player.vy = 0; player.onGround = true; player.jumps = 0;
      } else if (player.invuln <= 0) {
        respawn();
        return;
      }
    }
  }

  /* the floor */
  const gy = groundAt(feetX);
  if (gy != null && player.vy >= 0 && player.y + BOWEN_H >= gy && prevBottom <= gy + 12) {
    player.y = gy - BOWEN_H;
    player.vy = 0; player.onGround = true; player.jumps = 0;
  }

  /* --------------------------------------------------------------- dinos */
  for (const d of level.dinos) {
    if (d.dead) { d.dead++; continue; }
    if (d.patrol) {
      d.x += d.dir * 0.28;
      if (d.x < d.home - d.patrol) d.dir = 1;
      if (d.x > d.home + d.patrol) d.dir = -1;
    }
    d.t++;
    const dx = d.x + 2, dy = d.y + 3, dwid = DINO_W - 5, dhei = DINO_H - 3;
    if (overlaps(hb.x, hb.y, hb.w, hb.h, dx, dy, dwid, dhei)) {
      /* stomping from above squashes it — the rewarding outcome */
      if (player.vy > 0.8 && prevBottom <= d.y + 10) {
        d.dead = 1;
        player.vy = -5.2;
        player.jumps = 1;
        coins += 1;
        SFX.stomp();
        for (let i = 0; i < 8; i++) sparkles.push({
          x: d.x + DINO_W / 2, y: d.y + 4,
          vx: (Math.random() - 0.5) * 2.4, vy: -Math.random() * 1.8 - 0.3, life: 26
        });
      } else if (player.invuln <= 0) {
        respawn();
        return;
      }
    }
  }

  /* --------------------------------------------------------------- coins */
  for (const c of level.coins) {
    if (c.got) continue;
    if (overlaps(hb.x, hb.y, hb.w, hb.h, c.x, c.y, 8, 8)) {
      c.got = 1; coins++; SFX.coin();
      for (let i = 0; i < 5; i++) sparkles.push({
        x: c.x + 4, y: c.y + 4,
        vx: (Math.random() - 0.5) * 1.8, vy: -Math.random() * 1.6 - 0.4, life: 22
      });
    }
  }

  for (let i = sparkles.length - 1; i >= 0; i--) {
    const s = sparkles[i];
    s.x += s.vx; s.y += s.vy; s.vy += 0.09; s.life--;
    if (s.life <= 0) sparkles.splice(i, 1);
  }

  /* ---------------------------------------------------- safe-spot memory */
  safeTimer++;
  if (player.onGround && safeTimer > 8 && !hazardAhead(player.x)) {
    safe.x = player.x; safe.y = player.y + BOWEN_H; safeTimer = 0;
  }

  /* fell in a pit — straight back on solid ground, no fuss */
  if (player.y > VH + 30) respawn();

  /* ---------------------------------------------------------------- flag */
  if (!flagHit && player.x + BOWEN_W / 2 >= level.flagX) {
    flagHit = true;
    SFX.flag();
  }
  if (flagHit) {
    flagDrop = Math.min(1, flagDrop + 0.02);
    if (player.x > level.castleX + 26) {
      mode = "win"; winTimer = 0;
      spawnConfetti(70);
      SFX.win();
    }
  }

  /* ---------------------------------------------------------------- camera */
  const target = player.x - VW * 0.32;
  cam += (target - cam) * 0.18;
  if (cam < 0) cam = 0;
  if (cam > level.len - VW) cam = level.len - VW;
}

function spawnConfetti(n) {
  const cols = ["#ff4b4b", "#ffd93b", "#4ad2ff", "#5ec14a", "#ff8ad2", "#ffffff", "#ff9f2e"];
  for (let i = 0; i < n; i++) confetti.push({
    x: Math.random() * VW,
    y: -Math.random() * VH,
    vx: (Math.random() - 0.5) * 1.6,
    vy: 0.5 + Math.random() * 1.5,
    w: 2 + Math.floor(Math.random() * 3),
    h: 2 + Math.floor(Math.random() * 4),
    r: Math.random() * 6,
    spin: (Math.random() - 0.5) * 0.35,
    c: cols[Math.floor(Math.random() * cols.length)]
  });
}

/* =========================================================================
   DRAW
   ======================================================================= */
function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
  g.addColorStop(0, SKY);
  g.addColorStop(1, SKY_DUSK);
  ctx.fillStyle = g;
  ctx.fillRect(-4, -40, VW + 8, GROUND_Y + 40);
}

function drawCloud(x, y, s) {
  ctx.fillStyle = "#ffffff";
  const u = Math.round(4 * s);
  ctx.fillRect(x, y + u, u * 2, u);
  ctx.fillRect(x + u, y, u * 3, u * 2);
  ctx.fillRect(x + u * 3, y + u, u * 2, u);
  ctx.fillRect(x, y + u * 2, u * 5, u);
  ctx.fillStyle = "#dbe9ff";
  ctx.fillRect(x, y + u * 3, u * 5, Math.max(1, Math.round(u * 0.5)));
}

function drawScenery() {
  for (const c of level.clouds) {
    const x = c.x - cam * 0.28;
    if (x < -70 || x > VW + 20) continue;
    drawCloud(Math.round(x), c.y, c.s);
  }
  for (const h of level.hills) {
    const x = h.x - cam * 0.55;
    if (x < -h.w - 20 || x > VW + 20) continue;
    ctx.fillStyle = HILL_FAR;
    const steps = 4;
    for (let i = 0; i < steps; i++) {
      const inset = (h.w / 2) * (i / steps);
      const hh = (h.h / steps);
      ctx.fillRect(Math.round(x + inset), Math.round(GROUND_Y - hh * (i + 1)),
                   Math.round(h.w - inset * 2), Math.ceil(hh) + 1);
    }
    ctx.fillStyle = HILL_NEAR;
    ctx.fillRect(Math.round(x), GROUND_Y - 4, Math.round(h.w), 4);
  }
  for (const b of level.bushes) {
    const x = b.x - cam;
    if (x < -80 || x > VW + 20) continue;
    ctx.fillStyle = BUSH;
    const u = 6;
    for (let i = 0; i < b.size + 1; i++) {
      const bh = (i % 2 === 0) ? u * 2 : u * 3;
      ctx.fillRect(Math.round(x + i * u * 2), GROUND_Y - bh, u * 2 + 1, bh);
    }
    ctx.fillStyle = BUSH_TOP;
    for (let i = 0; i < b.size + 1; i++) {
      const bh = (i % 2 === 0) ? u * 2 : u * 3;
      ctx.fillRect(Math.round(x + i * u * 2), GROUND_Y - bh, u * 2 + 1, 2);
    }
  }
}

function drawGround() {
  const bottom = VH + 60;
  for (const g of level.grounds) {
    const x0 = g.x0 - cam, x1 = g.x1 - cam;
    if (x1 < -8 || x0 > VW + 8) continue;
    const px = Math.round(Math.max(x0, -8));
    const pw = Math.round(Math.min(x1, VW + 8)) - px;
    if (pw <= 0) continue;
    ctx.fillStyle = GROUND_TOP;
    ctx.fillRect(px, GROUND_Y, pw, 5);
    ctx.fillStyle = GROUND_A;
    ctx.fillRect(px, GROUND_Y + 5, pw, bottom - GROUND_Y - 5);

    /* brick seams */
    ctx.fillStyle = GROUND_B;
    const startTile = Math.floor((px + cam) / TS) * TS;
    for (let tx = startTile; tx < px + cam + pw + TS; tx += TS) {
      const sx = Math.round(tx - cam);
      if (sx < px - TS || sx > px + pw) continue;
      for (let ty = GROUND_Y + 5; ty < bottom; ty += TS) {
        const shift = ((ty - GROUND_Y) / TS) % 2 === 0 ? 0 : TS / 2;
        const bx = sx + shift;
        if (bx >= px - 1 && bx <= px + pw) ctx.fillRect(bx, ty, 1, TS);
      }
    }
    ctx.fillStyle = GROUND_C;
    for (let ty = GROUND_Y + 5 + TS; ty < bottom; ty += TS) ctx.fillRect(px, ty, pw, 1);
  }
}

function drawPipe(p) {
  const x = Math.round(p.x - cam), y = Math.round(p.y);
  if (x < -40 || x > VW + 10) return;
  const w = p.w, h = p.h;
  /* shaft */
  ctx.fillStyle = "#3f9433"; ctx.fillRect(x + 2, y + 12, w - 4, h - 12);
  ctx.fillStyle = "#67d24e"; ctx.fillRect(x + 4, y + 12, 4, h - 12);
  ctx.fillStyle = "#2b6e24"; ctx.fillRect(x + w - 7, y + 12, 4, h - 12);
  ctx.fillStyle = "#1d4d18"; ctx.fillRect(x + w - 3, y + 12, 1, h - 12);
  /* rim */
  ctx.fillStyle = "#3f9433"; ctx.fillRect(x, y, w, 12);
  ctx.fillStyle = "#67d24e"; ctx.fillRect(x + 2, y + 2, 4, 8);
  ctx.fillStyle = "#2b6e24"; ctx.fillRect(x + w - 5, y + 2, 4, 8);
  ctx.fillStyle = "#1d4d18"; ctx.fillRect(x, y + 10, w, 2);
  ctx.fillStyle = "#8ce87a"; ctx.fillRect(x + 1, y, w - 2, 1);
}

function drawPlat(p) {
  const x = Math.round(p.x - cam), y = Math.round(p.y);
  if (x < -p.w - 10 || x > VW + 10) return;
  for (let i = 0; i < p.w; i += TS) {
    ctx.fillStyle = "#c8641e"; ctx.fillRect(x + i, y, TS, TS);
    ctx.fillStyle = "#e88a3c"; ctx.fillRect(x + i, y, TS, 2);
    ctx.fillStyle = "#8f4212";
    ctx.fillRect(x + i, y + 7, TS, 1);
    ctx.fillRect(x + i, y + TS - 1, TS, 1);
    ctx.fillRect(x + i + TS / 2, y, 1, 7);
    ctx.fillRect(x + i, y + 8, 1, TS - 8);
  }
}

function drawDino(d) {
  const x = Math.round(d.x - cam);
  if (x < -40 || x > VW + 20) return;
  if (d.dead) {
    const a = Math.max(0, 1 - d.dead / 40);
    ctx.globalAlpha = a;
    ctx.drawImage(SPR.dinoSquash, x, Math.round(d.y));
    ctx.globalAlpha = 1;
    return;
  }
  const bob = Math.sin(d.t * 0.11) < 0 ? 0 : 1;
  ctx.drawImage(SPR.dino, x, Math.round(d.y) + bob);
  drawKyleOn(x, Math.round(d.y) + bob, d.t * 0.09);   // each dino rocks on its own beat
}

function drawFlagAndCastle() {
  const fx = Math.round(level.flagX - cam);
  const cx = Math.round(level.castleX - cam);

  /* flagpole */
  if (fx > -30 && fx < VW + 30) {
    const top = GROUND_Y - 96;
    ctx.fillStyle = "#d8d8d8"; ctx.fillRect(fx, top, 3, GROUND_Y - top);
    ctx.fillStyle = "#9a9a9a"; ctx.fillRect(fx + 2, top, 1, GROUND_Y - top);
    ctx.fillStyle = "#5ec14a"; ctx.fillRect(fx - 2, top - 5, 7, 5);
    ctx.fillStyle = "#8ce87a"; ctx.fillRect(fx - 1, top - 4, 3, 2);
    /* flag with a star on it */
    const fy = Math.round(top + 6 + flagDrop * 70);
    ctx.fillStyle = "#e33b3b"; ctx.fillRect(fx - 26, fy, 26, 22);
    ctx.fillStyle = "#ff6b6b"; ctx.fillRect(fx - 26, fy, 26, 2);
    drawText("*", fx - 20, fy + 5, 2.4, "#ffffff");
  }

  /* castle */
  if (cx > -140 && cx < VW + 40) {
    const w = 108, h = 92, y = GROUND_Y - h;
    ctx.fillStyle = "#c8641e"; ctx.fillRect(cx, y + 18, w, h - 18);
    ctx.fillStyle = "#8f4212";
    for (let ty = y + 18; ty < GROUND_Y; ty += 10) ctx.fillRect(cx, ty, w, 1);
    for (let tx = cx; tx < cx + w; tx += 12) ctx.fillRect(tx, y + 18, 1, h - 18);
    /* battlements */
    for (let i = 0; i < 7; i++) {
      if (i % 2 === 0) { ctx.fillStyle = "#c8641e"; ctx.fillRect(cx + i * 16, y + 6, 14, 14); }
    }
    /* towers */
    ctx.fillStyle = "#c8641e";
    ctx.fillRect(cx - 8, y - 12, 22, 30);
    ctx.fillRect(cx + w - 14, y - 12, 22, 30);
    ctx.fillStyle = "#8f4212";
    ctx.fillRect(cx - 8, y - 12, 22, 1); ctx.fillRect(cx + w - 14, y - 12, 22, 1);
    /* door */
    ctx.fillStyle = "#3a1c08";
    ctx.fillRect(cx + w / 2 - 12, GROUND_Y - 34, 24, 34);
    ctx.fillRect(cx + w / 2 - 10, GROUND_Y - 40, 20, 8);
    /* windows */
    ctx.fillStyle = "#3a1c08";
    ctx.fillRect(cx + 16, y + 34, 8, 12);
    ctx.fillRect(cx + w - 24, y + 34, 8, 12);
    /* little flag */
    ctx.fillStyle = "#d8d8d8"; ctx.fillRect(cx + w / 2, y - 34, 2, 24);
    ctx.fillStyle = "#ffd93b"; ctx.fillRect(cx + w / 2 + 2, y - 34, 18, 12);
  }
}

function drawCoins() {
  const f = Math.floor(frame / 6) % 4;
  for (const c of level.coins) {
    if (c.got) continue;
    const x = Math.round(c.x - cam);
    if (x < -12 || x > VW + 12) continue;
    const bob = Math.round(Math.sin((frame + c.x) * 0.06) * 1.5);
    ctx.drawImage(SPR.coin[f], x, Math.round(c.y) + bob);
  }
}

function drawPlayer() {
  if (player.invuln > 0 && Math.floor(frame / 4) % 2 === 0) return;
  const x = Math.round(player.x - cam), y = Math.round(player.y);
  const spr = player.onGround ? SPR.bowenRun[Math.floor(player.anim) % 4] : SPR.bowenJump;
  const bodyY = y + BOWEN_BODY_OFF;
  ctx.drawImage(spr, x, bodyY);
  /* head rocks harder while running, settles to a lean mid-air */
  drawBowenHead(x + BOWEN_W / 2, bodyY + 3, player.onGround ? 1 : 0.5);
}

/* Falls back to a pixel head if the photo hasn't been embedded yet. */
function drawBowenHead(cx, chinY, amount) {
  if (drawFace(bowenFace, cx, chinY, BOWEN_HEAD_W, bobble, amount)) return;
  ctx.drawImage(SPR.bowenHeadPixels,
    Math.round(cx - SPR.bowenHeadPixels.width / 2),
    Math.round(chinY - SPR.bowenHeadPixels.height));
}

function drawSparkles() {
  for (const s of sparkles) {
    ctx.fillStyle = s.life > 12 ? "#fff6c4" : "#ffd93b";
    ctx.fillRect(Math.round(s.x - cam), Math.round(s.y), 2, 2);
  }
}

function drawHUD() {
  ctx.drawImage(SPR.coin[Math.floor(frame / 6) % 4], 10, 10);
  drawText("BOWEN * " + coins, 22, 10, 1.6, "#ffffff", "#2a2a2a");
  if (mode === "play" && (!hasJumped || hintFade > 0)) {
    ctx.globalAlpha = hasJumped ? hintFade / 60 : 1;
    const blink = hasJumped || Math.floor(frame / 24) % 2 === 0;
    if (blink) drawTextCentered("TAP TO JUMP", VW / 2, GROUND_Y - 58, 2.4, "#ffd93b", "#1d3a7a");
    ctx.globalAlpha = 1;
  }
}

function drawStartScreen() {
  drawSky();
  for (let i = 0; i < 7; i++) drawCloud(20 + i * 62 - (frame * 0.12 % 62), 14 + (i % 3) * 24, 1 + (i % 2) * 0.4);

  /* ground strip */
  ctx.fillStyle = GROUND_TOP; ctx.fillRect(0, GROUND_Y, VW, 5);
  ctx.fillStyle = GROUND_A; ctx.fillRect(0, GROUND_Y + 5, VW, VH - GROUND_Y);
  ctx.fillStyle = GROUND_C;
  for (let ty = GROUND_Y + 5 + TS; ty < VH; ty += TS) ctx.fillRect(0, ty, VW, 1);
  ctx.fillStyle = GROUND_B;
  for (let tx = 0; tx < VW; tx += TS) ctx.fillRect(tx, GROUND_Y + 5, 1, VH - GROUND_Y);

  /* title */
  const cx = VW / 2;
  const bounce = Math.round(Math.sin(frame * 0.05) * 2);

  drawTextCentered("HAPPY BIRTHDAY", cx, 12 + bounce, 2.8, "#ffffff", "#1d3a7a");
  drawTextCentered("BOWEN", cx, 34 + bounce, 5.2, "#ffd93b", "#a8531a");
  drawTextCentered("LOVE UNCLE KYLE", cx, 78, 2.2, "#ffffff", "#1d3a7a");
  drawTextCentered("TAP THE SCREEN TO JUMP", cx, 100, 1.8, "#ffd93b", "#1d3a7a");

  /* Bowen on the left, a Kyle-headed dino on the right */
  const bx = Math.round(cx - 80), dxp = Math.round(cx + 52);
  const bob = Math.sin(frame * 0.1) < 0 ? 0 : 1;
  const bodyY = GROUND_Y - BOWEN_BODY_H;
  ctx.drawImage(SPR.bowenRun[Math.floor(player.anim) % 4], bx, bodyY);
  drawBowenHead(bx + BOWEN_W / 2, bodyY + 3, 1);
  ctx.drawImage(SPR.dino, dxp, GROUND_Y - DINO_H + bob);
  drawKyleOn(dxp, GROUND_Y - DINO_H + bob);

  if (Math.floor(frame / 26) % 2 === 0) {
    drawTextCentered("TAP TO PLAY", cx, VH - 24, 2.4, "#ffffff", "#1d3a7a");
  }
}

function drawWinScreen() {
  drawSky();
  for (let i = 0; i < 7; i++) drawCloud(20 + i * 62, 14 + (i % 3) * 24, 1 + (i % 2) * 0.4);
  ctx.fillStyle = GROUND_TOP; ctx.fillRect(0, GROUND_Y, VW, 5);
  ctx.fillStyle = GROUND_A; ctx.fillRect(0, GROUND_Y + 5, VW, VH - GROUND_Y);
  ctx.fillStyle = GROUND_C;
  for (let ty = GROUND_Y + 5 + TS; ty < VH; ty += TS) ctx.fillRect(0, ty, VW, 1);

  const cx = VW / 2;
  const wbx = Math.round(cx - BOWEN_W / 2), wby = GROUND_Y - BOWEN_BODY_H;
  ctx.drawImage(SPR.bowenRun[Math.floor(frame * 0.18) % 4], wbx, wby);
  drawBowenHead(wbx + BOWEN_W / 2, wby + 3, 1.4);      // extra happy wobble

  const bounce = Math.round(Math.sin(frame * 0.09) * 2);
  drawTextCentered("CONGRATS BOWEN!", cx, 14 + bounce, 3, "#ffffff", "#1d3a7a");
  drawTextCentered("YOU WIN!", cx, 42 + bounce, 5, "#ffd93b", "#a8531a");
  drawTextCentered("YOU GOT " + coins + " COINS", cx, 84, 2, "#ffffff", "#1d3a7a");
  drawTextCentered("LOVE UNCLE KYLE", cx, 102, 2.2, "#ffffff", "#1d3a7a");

  /* confetti over the top */
  for (const p of confetti) {
    ctx.save();
    ctx.translate(Math.round(p.x), Math.round(p.y));
    ctx.rotate(p.r);
    ctx.fillStyle = p.c;
    ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    ctx.restore();
  }

  if (winTimer > 90 && Math.floor(frame / 26) % 2 === 0) {
    drawTextCentered("TAP TO PLAY AGAIN", cx, VH - 22, 2, "#ffffff", "#1d3a7a");
  }
}

function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, offX * dpr, offY * dpr);
  ctx.imageSmoothingEnabled = false;

  if (mode === "intro") { drawIntro(); }
  else if (mode === "start") { drawStartScreen(); }
  else if (mode === "win") { drawWinScreen(); }
  else {
    drawSky();
    drawScenery();
    drawFlagAndCastle();
    drawGround();
    for (const p of level.plats) drawPlat(p);
    for (const p of level.pipes) drawPipe(p);
    drawCoins();
    for (const d of level.dinos) drawDino(d);
    drawSparkles();
    drawPlayer();
    drawHUD();
  }

  if (portraitBlock) {
    /* cover the whole device surface, letterbox included, so it reads as one
       deliberate screen rather than a dimmed strip floating in black */
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = "#121a33";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, offX * dpr, offY * dpr);
    const cx = VW / 2;
    drawTextCentered("TURN YOUR PHONE", cx, VH / 2 - 26, 2.2, "#ffffff", "#1d3a7a");
    drawTextCentered("SIDEWAYS TO PLAY", cx, VH / 2 - 4, 2.2, "#ffffff", "#1d3a7a");
    /* a little rotating phone */
    const r = Math.sin(frame * 0.05) * 0.5;
    ctx.save();
    ctx.translate(cx, VH / 2 + 34);
    ctx.rotate(r);
    ctx.fillStyle = "#ffffff"; ctx.fillRect(-8, -14, 16, 28);
    ctx.fillStyle = "#1d3a7a"; ctx.fillRect(-6, -11, 12, 22);
    ctx.restore();
  }
}

/* =========================================================================
   RESIZE + LOOP
   ======================================================================= */
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  const cw = Math.max(1, window.innerWidth);
  const ch = Math.max(1, window.innerHeight);

  portraitBlock = (cw / ch) < 0.78;

  VW = Math.round(VH * cw / ch);
  VW = Math.max(240, Math.min(520, VW));

  scale = Math.min(cw / VW, ch / VH);
  offX = (cw - VW * scale) / 2;
  offY = (ch - VH * scale) / 2;

  canvas.width = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  canvas.style.width = cw + "px";
  canvas.style.height = ch + "px";
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", () => setTimeout(resize, 120));
resize();

let last = performance.now();
let acc = 0;
const STEP = 1000 / 60;

function loop(now) {
  requestAnimationFrame(loop);
  let dt = now - last;
  last = now;
  if (dt > 250) dt = 250;          // tab was backgrounded — don't fast-forward
  acc += dt;
  let guard = 0;
  while (acc >= STEP && guard < 5) { update(); acc -= STEP; guard++; }
  if (guard >= 5) acc = 0;
  draw();
}
requestAnimationFrame(loop);
</script>
</body>
</html>
